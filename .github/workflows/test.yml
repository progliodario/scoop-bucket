name: Test the manifest

on:
  push:
  workflow_dispatch:

jobs:
  install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Scoop
        shell: pwsh
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh -OutFile install.ps1
          .\install.ps1 -RunAsAdmin
          Write-Output "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install YT Grabber from this bucket, start it, remove it
        shell: pwsh
        run: |
          scoop bucket add progliodario https://github.com/progliodario/scoop-bucket
          scoop install progliodario/yt-grabber
          $app = "$env:USERPROFILE\scoop\apps\yt-grabber\current\YT-Grabber.exe"
          if (-not (Test-Path $app)) { throw 'YT-Grabber.exe was not installed' }
          Start-Process $app -ArgumentList '--background','--port','8795'
          $ok = $false
          for ($i = 0; $i -lt 300; $i++) {   # the first start downloads ffmpeg
            try { $r = Invoke-RestMethod http://127.0.0.1:8795/api/ping -TimeoutSec 3; if ($r.app -eq 'yt-grabber') { $ok = $true; break } } catch { }
            Start-Sleep 2
          }
          if (-not $ok) { throw 'YT Grabber did not answer' }
          Write-Host "version $($r.version)"
          Invoke-RestMethod -Method Post -Headers @{ 'X-YTG' = '1' } -ContentType 'application/json' -Body '{}' http://127.0.0.1:8795/api/quit | Out-Null
          Start-Sleep 5
          scoop uninstall yt-grabber
          if (Test-Path $app) { throw 'uninstall left the program behind' }
          Write-Host 'install, start and uninstall OK'