name: Excavator

# Looks for new YT Grabber releases every 6 hours and updates the manifest by itself.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  excavate:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: '1'